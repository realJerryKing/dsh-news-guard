- insert:
    - id: news-guard
      name: '@local/dsh-news-guard'
      config:
        enabled: true
        # Delivery target. Leave empty here and put the id in ONE of:
        #   * config.relayTaskId below (highest priority)
        #   * env NEWS_GUARD_RELAY_TASK
        #   * ~/.dsh/news-guard/relay-task.txt   <- keeps machine ids out of git
        # Create the task with a far-future rrule; the plugin only rewrites its
        # prompt and calls run(), so each alert lands as a fresh message at once.
        relayTaskId: ''
        # Second task, woken only when a headline is worth a human-level call.
        # Same resolution order, file ~/.dsh/news-guard/candidate-task.txt.
        candidateTaskId: ''
        intervalSeconds: 45
        # News feeds move on a minutes scale and honour ETag/Last-Modified, so
        # they sit on their own slower cadence (304 costs zero bytes).
        newsIntervalSeconds: 300
        minMagGlobal: 6.0
        minMagChina: 4.5
        keywordRules: true
        marketRules: true
        # Broader scan: matches wake the judge task, never the user directly.
        candidateRules: true
        maxNewsAgeMinutes: 45
        # Deprecated: category-level suppression swallowed second events of the
        # same type. Dedupe is per headline now; kept so old configs still parse.
        cooldownMinutes: 30
        marketDropPercent: 5
        maxAlertsPerHour: 12
        maxAlertsPerMessage: 10
        candidateGapMinutes: 60
        maxCandidateWakesPerDay: 6
        selfTest: false
